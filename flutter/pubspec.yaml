name: app_update_guard
description: "Atualização obrigatória de apps Android distribuídos fora da Play Store: bloqueio pela versão exigida no servidor, download do APK e instalação pelo próprio app."
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  package_info_plus: ">=8.0.0 <10.0.0"
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.belovale.app_update_guard
        pluginClass: AppUpdateGuardPlugin
